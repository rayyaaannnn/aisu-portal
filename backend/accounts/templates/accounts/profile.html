<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile - AISU Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .row { display:flex; gap:16px; align-items:center; }
        label { font-weight:600; display:block; margin-bottom:6px; }
        input, select { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #ddd; }
        .actions { margin-top:12px; display:flex; gap:8px; }
        .btn { padding:8px 14px; border-radius:6px; border: none; cursor:pointer; font-weight:600; }
        .btn-primary { background: linear-gradient(135deg,#667eea,#764ba2); color:white; }
        .btn-secondary { background:#eee; }
        .message { padding:10px; margin-bottom:12px; border-radius:6px; background:#e6ffed; color:#064e3b; }
        .meta { color:#555; margin-bottom:12px; }
        a.profile-btn { display:inline-block; background:#3498db; color:white; padding:8px 12px; border-radius:6px; text-decoration:none }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h2>My Profile</h2>
            <a href="{% url 'super_admin' %}" style="text-decoration:none;">← Back</a>
        </div>

        <div class="card">
            {% if message %}
            <div class="message">{{ message }}</div>
            {% endif %}

            <div style="display:flex; gap:18px; align-items:center; margin-bottom:12px;">
                <div style="width:96px; height:96px; border-radius:8px; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center;">
                    {% if profile.photo_url %}
                        <img src="{{ profile.photo_url }}" alt="avatar" style="width:100%; height:100%; object-fit:cover; display:block;" />
                    {% else %}
                        <div style="color:#667; font-size:28px;">👤</div>
                    {% endif %}
                </div>
                <div>
                    <div class="meta">Username: <strong>{{ profile.user.username }}</strong></div>
                    <div class="meta">Role: <strong>{{ profile.get_role_display }}</strong></div>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px;">
                    <div>
                        <label for="first_name">First name</label>
                        <input id="first_name" name="first_name" value="{{ profile.user.first_name|default_if_none:'' }}" />
                    </div>
                    <div>
                        <label for="last_name">Last name</label>
                        <input id="last_name" name="last_name" value="{{ profile.user.last_name|default_if_none:'' }}" />
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px;">
                    <div>
                        <label for="email">Email</label>
                        <input id="email" name="email" value="{{ profile.user.email|default_if_none:'' }}" />
                    </div>
                    <div>
                        <label for="phone">Phone</label>
                        <input id="phone" name="phone" value="{{ profile.phone|default_if_none:'' }}" />
                    </div>
                </div>

                <div style="margin-bottom:10px;">
                    <label for="photo_url">Photo URL</label>
                    <input id="photo_url" name="photo_url" value="{{ profile.photo_url|default_if_none:'' }}" placeholder="https://..." />
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'manage_users' %}" class="btn btn-secondary" style="text-decoration:none; padding:8px 12px;">Manage Users</a>
                    </div>
                    <div style="text-align:right; display:flex; justify-content:flex-end; align-items:center; gap:8px;">
                        <form method="post" action="{% url 'logout' %}" style="margin:0;">
                            {% csrf_token %}
                            <button type="submit" class="btn" style="background:#e74c3c; color:white; padding:8px 12px; border-radius:6px;">Logout</button>
                        </form>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
